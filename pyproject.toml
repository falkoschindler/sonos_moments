[project]
name = "sonos-moments"
version = "0.2.0"
description = "Sonos Controller based on NiceGUI"
authors = [{ name = "Falko Schindler", email = "mail@falkoschindler.de" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dataclasses-json>=0.6.7,<0.7.0",
    "nicegui>=3.0,<4.0",
    "soco>=0.31.1,<0.32.0",
]

[project.scripts]
sonos-moments = "sonos_moments.app:main_without_reload"

[dependency-groups]
dev = ["ruff>=0.16.0"]

[build-system]
requires = ["uv_build>=0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""  # the package lives in the project root, not in src/

[tool.mypy]

[[tool.mypy.overrides]]
module = "soco.*"
ignore_missing_imports = true

[tool.ruff]
indent-width = 4
line-length = 120

[tool.ruff.lint]
select = [
    "I",  # isort
    "E",  # pycodestyle
    "W",  # pycodestyle
    "B",  # bugbear
    "F",  # pyflakes
    "UP", # pyupgrade
    "RUF", # ruff
    "PL", # pylint
]
fixable = [
    "I",  # isort
]
ignore = [
    "E501", # line too long
    "PLR2004", # magic value comparison
]
